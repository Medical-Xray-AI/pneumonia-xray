experiment:
  name: custom_cnn_baseline
  seed: 42

data_config: configs/data.yaml

model:
  name: small_cnn
  pretrained: false
  output_units: 1

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  loss: weighted_bce_with_logits
  mixed_precision: true

scheduler:
  name: reduce_lr_on_plateau
  monitor: validation_macro_f1
  mode: max
  patience: 2

early_stopping:
  monitor: validation_macro_f1
  mode: max
  patience: 5

augmentation:
  horizontal_flip_probability: 0.0
  rotation_degrees: 5
  translation_fraction: 0.03
  brightness_contrast_probability: 0.2
  brightness: 0.15
  contrast: 0.15

overfit:
  subset_size: 32
  epochs: 200
  learning_rate: 0.003
  weight_decay: 0.0
  dropout: 0.0

normalization:
  type: dataset_statistics

checkpoint:
  save_best_only: true
  monitor: validation_macro_f1