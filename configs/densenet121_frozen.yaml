experiment:
  name: densenet121_pretrained
  seed: 42
data_config: configs/data.yaml
model:
  name: densenet121
  pretrained: true
  weights: IMAGENET1K_V1
  output_units: 1
  dropout: 0.2
  freeze_strategy: head_only
training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  loss: weighted_bce_with_logits
  mixed_precision: true
  deterministic: true
  grad_accum_steps: 1
  max_grad_norm: 5.0
scheduler:
  name: reduce_lr_on_plateau
  monitor: validation_macro_f1
  mode: max
  patience: 2
  factor: 0.5
  min_lr: 1.0e-07
early_stopping:
  monitor: validation_macro_f1
  mode: max
  patience: 4
  min_delta: 0.001
augmentation:
  horizontal_flip_probability: 0.0
  rotation_degrees: 5
  translation_fraction: 0.03
  brightness_contrast_probability: 0.2
normalization:
  type: imagenet
checkpoint:
  save_best_only: true
  monitor: validation_macro_f1
