# M0: frozen ImageNet backbone; train only the binary classifier head.
seed: 42
split_version: split_v1
data:
  manifest: audit_out/split_manifest.csv
  split_column: new_split
  image_size: 224
  loader: {num_workers: 4, persistent_workers: true}
  augmentation: {enabled: true, rotation_degrees: 5.0, translate_fraction: 0.02}
model:
  name: densenet121
  pretrained: true
  dropout: 0.20
  freeze_strategy: head_only
training:
  device: auto
  epochs: 15
  batch_size: 16
  amp: true
  deterministic: true
  grad_accum_steps: 1
  max_grad_norm: 5.0
  monitor: macro_f1
  training_threshold: 0.5
  optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.0001}
  scheduler: {name: reduce_on_plateau, factor: 0.5, patience: 2, min_lr: 0.0000001}
  loss: {name: bce_with_logits, pos_weight: auto}
  early_stopping: {patience: 4, min_delta: 0.001}
output:
  root: ${XRAY_OUTPUT_ROOT}
