# Canonical Member-3 DenseNet121 run. Selection uses validation Macro F1 only.
seed: 42
split_version: split_v1

data:
  # This is Member 1's corrected leakage-aware manifest. The trainer remaps
  # its image paths under XRAY_DATA_ROOT when needed.
  manifest: audit_out/split_manifest.csv
  split_column: new_split
  image_size: 224
  loader:
    num_workers: 4
    persistent_workers: true
  augmentation:
    # Used only if Member 2's src/data/transforms.py is not merged yet.
    enabled: true
    rotation_degrees: 5.0
    translate_fraction: 0.02

model:
  name: densenet121
  pretrained: true
  dropout: 0.20
  # head_only=M0, last_block=M1/canonical, full=all backbone layers trainable.
  freeze_strategy: last_block

training:
  device: auto
  epochs: 15
  batch_size: 16
  amp: true
  deterministic: true
  grad_accum_steps: 1
  max_grad_norm: 5.0
  monitor: macro_f1
  training_threshold: 0.5
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 2
    min_lr: 0.0000001
  loss:
    name: bce_with_logits
    # Computed from TRAIN manifest only: N_NORMAL / N_PNEUMONIA.
    pos_weight: auto
  early_stopping:
    patience: 4
    min_delta: 0.001

output:
  # Keep checkpoints/logs outside Git. On the server, set XRAY_OUTPUT_ROOT.
  root: ${XRAY_OUTPUT_ROOT}
